# Mac-palvelun osoite / address of the Mac service.
# deploy-kindle.sh vaihtaa MAC_IP:n Macin osoitteeksi / replaces MAC_IP with the Mac's IP.
URL=http://MAC_IP:8088/kindle.png
# Etuvalon kirkkaus / front light brightness (0 = pois / off)
FRONTLIGHT=0
# 1 = Wi-Fi pois hakujen välillä (säästää akkua, estää yhteyden jumittumisen).
# 0 = Wi-Fi aina päällä (tarvitaan kehitysyhteyteen).
# 1 = Wi-Fi off between fetches (saves battery, avoids stuck connections).
# 0 = Wi-Fi always on (needed for the dev telnet access).
WIFI_OFF_BETWEEN=1
