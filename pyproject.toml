[project]
name = "kindle"
version = "0.1.0"
description = "Weather and Finnish spot electricity prices on a jailbroken Kindle"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
